# Local development services.
#   docker compose up -d                        -> database only (normal development)
#   docker compose --profile app up -d --build  -> also the API in Docker, on 127.0.0.1:8080

x-app: &app
  build: .
  image: mizan:local
  profiles: ["app"]  # only started when asked for with --profile app
  environment: &app-env
    # Inside Docker, "db" is the database service's hostname (not localhost).
    DATABASE_URL: postgresql+asyncpg://mizan:mizan@db:5432/mizan
    # Ollama runs on the Mac itself; host.docker.internal reaches the host from a container.
    OLLAMA_URL: http://host.docker.internal:11434
    ENVIRONMENT: docker

services:
  db:
    # Official Postgres 17 with the pgvector extension pre-built (used for embeddings from week 3).
    image: pgvector/pgvector:pg17
    container_name: mizan-db
    environment:
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan          # local-only password; real secrets never go in this file
      POSTGRES_DB: mizan
    ports:
      - "5432:5432"                     # host:container — your Mac's 5432 forwards into the container
    volumes:
      - pgdata:/var/lib/postgresql/data # named volume: data survives `docker compose down`
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Docker marks the container "healthy" only when Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U mizan -d mizan"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    # One-off job: bring the schema up to date, then exit. Runs BEFORE the API starts.
    # (Not done inside the API's startup: with several API copies, they would all race.)
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully  # never serve traffic on an old schema
    ports:
      - "127.0.0.1:8080:8000"  # 8080 on the Mac, so it can't clash with `fastapi dev` on 8000
    restart: unless-stopped

volumes:
  pgdata:
