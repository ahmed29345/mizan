[project]
name = "mizan"
version = "0.1.0"
description = "Arabic/English AI compliance copilot (learning project): RAG, multi-agent review, evaluation"
readme = "README.md"
authors = [
    { name = "ahmed29345", email = "ahmed29345@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.4",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.fastapi]
# Lets `uv run fastapi dev` find the app without typing the path.
entrypoint = "mizan.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors, I = import order, UP = modern Python syntax, B = common bugs, ASYNC = async mistakes
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[tool.alembic]
# Database migrations. Common commands:
#   uv run alembic revision --autogenerate -m "add x"   -> write a migration from model changes
#   uv run alembic upgrade head                         -> apply all migrations
#   uv run alembic downgrade -1                         -> undo the last one
#   uv run alembic check                                -> fail if models and migrations differ
script_location = "%(here)s/migrations"
# File names start with date/time so they sort in the order they were written.
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

# Run ruff on every generated migration so it passes lint in CI.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
