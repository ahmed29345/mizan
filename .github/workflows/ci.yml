# Runs on every push and pull request: lint, format check, then tests against a real Postgres.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A "service container": GitHub starts this Postgres next to the job, like docker compose does locally.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan
          POSTGRES_DB: mizan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mizan -d mizan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://mizan:mizan@localhost:5432/mizan
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Models and migrations match
        # Fails if someone changed a model but forgot to generate a migration.
        run: uv run alembic check

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        # Creates and migrates its own mizan_test database. Uses a fake embedder: no Ollama in CI.
        run: uv run pytest

  # Build the production image and prove it actually starts and serves /health.
  image:
    runs-on: ubuntu-latest
    needs: test  # only build images from code whose tests pass

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan
          POSTGRES_DB: mizan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mizan -d mizan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://mizan:mizan@localhost:5432/mizan

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true  # keep the image on this runner for the checks below (no registry push yet)
          tags: mizan:ci
          cache-from: type=gha  # reuse layers from earlier CI runs
          cache-to: type=gha,mode=max

      - name: Image does not run as root
        run: test "$(docker run --rm --entrypoint id mizan:ci -u)" != "0"

      - name: Migrations run from the image
        run: docker run --rm --network host -e DATABASE_URL mizan:ci alembic upgrade head

      - name: API starts and /health is OK
        run: |
          docker run -d --name api --network host -e DATABASE_URL mizan:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; docker logs api; exit 1
